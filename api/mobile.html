<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B-Handless — 데스크톱 전용</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f13;
      color: #e2e2e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 380px;
      width: 100%;
      background: #1a1a24;
      border: 1px solid #2e2e40;
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
    }
    .icon { font-size: 56px; margin-bottom: 20px; line-height: 1; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; color: #fff; }
    p  { font-size: 14px; line-height: 1.7; color: #9090a8; }
    .badge {
      display: inline-block;
      margin-top: 28px;
      padding: 8px 20px;
      background: #2e2e40;
      border-radius: 999px;
      font-size: 12px;
      color: #6060a0;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🖥️</div>
    <h1>데스크톱 전용 앱입니다</h1>
    <p>
      B-Handless는 Windows 데스크톱 환경에서만 동작합니다.<br>
      PC 브라우저로 접속해 주세요.
    </p>
    <span class="badge">Mobile &amp; Tablet 미지원</span>
  </div>
</body>
</html>
